# Nginx sirve la página web y reenvía las peticiones al otro contenedor.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # Docker Compose resuelve el nombre 'backend' en su red interna.
    location /api/ {
        proxy_pass http://backend:3000;
        proxy_set_header Host $host;
    }
}
